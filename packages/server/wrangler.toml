name = "pluggable-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# To set secrets locally, create a .dev.vars file in packages/server/ with:
# OPENAI_API_KEY=sk-...
# This file is gitignored and only used by wrangler dev.

[vars]
OPENAI_API_KEY = ""
OPENROUTER_API_KEY = ""
LLM_MODEL = "openrouter/auto"

# Replaces [text_blobs] for ES Module Workers
[[rules]]
globs = ["**/*.js"]
type = "Text"
fallthrough = true

[[rules]]
globs = ["**/*.html"]
type = "Text"
fallthrough = true

